<style>
/* Direction 2 · colored cards: lavender ground, white option cards, filled purple when chosen, 5-segment progress */
:root{
  --purple:#7752a8; --purple-deep:#5e3d8c; --purple-soft:#ece5f6; --purple-line:#e1d8ef;
  --bg:#f4f0fa; --card:#ffffff; --ink:#2a1f3d; --muted:#7a6f8f; --on-purple:#ffffff;
  --err-bg:#fdecef; --err:#c0243c;
  --high-bg:#7752a8; --high-ink:#fff; --pre-bg:#ece5f6; --pre-ink:#5e3d8c;
  --f:"Readex Pro","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --purple:#9b7ad0; --purple-deep:#b89be3; --purple-soft:#2d2442; --purple-line:#3a2f54;
    --bg:#171224; --card:#221b33; --ink:#efe9f8; --muted:#a99fbe; --on-purple:#ffffff;
    --err-bg:#3a1820; --err:#ff8c9c; --pre-bg:#2d2442; --pre-ink:#d6c6f0; color-scheme:dark }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
.screen{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:18px 22px}
.screen.purple{background:var(--purple);color:var(--on-purple);max-width:none}
.screen.purple > .inner{max-width:480px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}
@media (min-width:560px){ body{padding-block:24px} .screen{border-radius:28px;min-height:calc(100dvh - 48px);box-shadow:0 20px 60px -30px rgba(60,30,110,.35);background:var(--card)} .screen.purple{max-width:480px;background:var(--purple)} .screen.purple > .inner{max-width:none} }
/* top bar */
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.bars{flex:1;display:flex;gap:6px}
.bars i{flex:1;height:5px;border-radius:9px;background:var(--purple-line);transition:background .3s}
.bars i.on{background:var(--purple)}
.back{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;flex:none}
.back svg{width:20px;height:20px}
.back[disabled]{visibility:hidden}
.sec{font-size:12.5px;font-weight:600;color:var(--purple);margin:0 0 4px}
h2{font-size:23px;font-weight:700;line-height:1.45;margin:0 0 4px;text-wrap:balance}
.hint{font-size:13.5px;color:var(--purple);font-weight:500;margin:0 0 18px}
main{flex:1}
main.anim{animation:in .35s ease}
@keyframes in{from{opacity:.0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){main,.stack .c{animation:none!important}}
/* option cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid.one{grid-template-columns:1fr}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:74px;
  text-align:center;background:var(--card);color:var(--ink);border:1.5px solid var(--purple-line);border-radius:16px;
  padding:14px 12px;font:inherit;font-size:15.5px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .1s;min-width:0}
.opt.wide{grid-column:1/-1}
.opt.icon{align-items:flex-start;text-align:right;justify-content:flex-end;min-height:104px}
.grid.one .opt{flex-direction:row;justify-content:flex-start;text-align:right;min-height:60px}
.grid.one .opt.icon{min-height:60px;align-items:center}
.opt .ic{width:34px;height:34px;border-radius:50%;background:var(--purple-soft);color:var(--purple);display:grid;place-items:center;flex:none}
.opt .ic svg{width:18px;height:18px}
.opt .lbl{min-width:0}
.opt .tick{position:absolute;top:10px;left:10px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--purple-line);display:grid;place-items:center}
.opt .tick svg{width:12px;height:12px;opacity:0}
.grid.one .opt .tick{position:static;margin-inline-start:auto}
.opt:hover{border-color:var(--purple)}
.opt:active{transform:scale(.985)}
.opt[aria-checked="true"]{background:var(--purple);color:var(--on-purple);border-color:var(--purple)}
.opt[aria-checked="true"] .ic{background:rgba(255,255,255,.95);color:var(--purple)}
.opt[aria-checked="true"] .tick{background:#fff;border-color:#fff}
.opt[aria-checked="true"] .tick svg{opacity:1;color:var(--purple)}
.opt:focus-visible,.btn:focus-visible,.scale button:focus-visible,textarea:focus-visible,.back:focus-visible,.fpick:focus-visible,.badge:focus-visible{outline:3px solid var(--purple-deep);outline-offset:2px}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
/* scale */
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.scale button{font:inherit;font-size:20px;font-weight:700;height:60px;border-radius:16px;border:1.5px solid var(--purple-line);background:var(--card);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.scale button[aria-checked="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
.scale-lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:8px}
/* example card */
.ex{background:var(--card);border:1.5px solid var(--purple-line);border-radius:16px;padding:12px 14px;margin-bottom:16px;font-size:13.5px}
.ex .cap{font-size:11.5px;color:var(--muted);font-weight:600}
.ex h3{font-size:15px;margin:6px 0 4px;line-height:1.5}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 11px;border:0;cursor:default}
.badge svg{width:13px;height:13px}
.badge.high{background:var(--high-bg);color:var(--high-ink)}
.badge.pre{background:var(--pre-bg);color:var(--pre-ink)}
button.badge{cursor:pointer}
.reason{margin-top:10px;background:var(--purple-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.reason b{display:block;margin-bottom:2px}
/* display forms */
.forms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.fpick{position:relative;text-align:right;font:inherit;font-size:12.5px;line-height:1.65;color:var(--ink);background:var(--card);border:1.5px solid var(--purple-line);border-radius:16px;padding:34px 12px 12px;cursor:pointer;min-width:0}
.fpick .letter{position:absolute;top:8px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--purple-soft);color:var(--purple);display:grid;place-items:center;font-weight:700;font-size:13px}
.fpick h4{font-size:13px;margin:0 0 4px}
.fpick ul{margin:0;padding-right:16px}
.fpick .more{color:var(--purple);font-weight:600}
.fpick[aria-checked="true"]{border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-soft)}
.fpick[aria-checked="true"] .letter{background:var(--purple);color:#fff}
/* text */
.tbox{position:relative;background:var(--card);border:1.5px solid var(--purple-line);border-radius:16px;padding:12px}
.tbox .bulb{width:36px;height:36px;border-radius:50%;background:var(--purple-soft);color:var(--purple);display:grid;place-items:center}
.tbox .bulb svg{width:18px;height:18px}
textarea{width:100%;min-height:130px;border:0;background:transparent;color:var(--ink);font:inherit;resize:vertical;padding:8px 2px 0}
textarea:focus{outline:none}
.tbox:focus-within{border-color:var(--purple)}
.pill{display:inline-block;background:var(--purple-soft);color:var(--purple);font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;margin-bottom:16px}
/* footer */
.foot{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.err{display:flex;align-items:center;gap:8px;background:var(--err-bg);color:var(--err);border:1.5px solid var(--err);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600}
.err svg{width:18px;height:18px;flex:none}
.btn{font:inherit;font-weight:600;font-size:16px;border-radius:16px;padding:14px 20px;cursor:pointer;border:0;width:100%;background:var(--purple);color:#fff}
.btn:disabled{opacity:.6;cursor:progress}
.btn svg{width:18px;height:18px;vertical-align:-3px}
.btn.white{background:#fff;color:var(--purple)}
/* welcome & done */
.lang{font-size:13px;opacity:.85;margin-bottom:8px}
.stack{position:relative;height:250px;margin:14px 0 6px}
.stack .c{position:absolute;border-radius:22px;display:grid;place-items:center;box-shadow:0 16px 40px -18px rgba(30,10,70,.55);animation:float 5s ease-in-out infinite}
.stack .c1{width:44%;height:66%;right:6%;top:4%;background:#efe9f8;transform:rotate(7deg);color:var(--purple)}
.stack .c2{width:40%;height:58%;left:6%;top:16%;background:#a284cc;transform:rotate(-8deg);color:#fff;animation-delay:-1.5s}
.stack .c3{width:42%;height:66%;left:29%;top:24%;background:#fff;color:var(--purple);transform:rotate(-2deg);flex-direction:column;gap:6px;font-weight:600;animation-delay:-3s}
.stack .c svg{width:40px;height:40px}
.stack .c3 svg{width:48px;height:48px}
@keyframes float{50%{translate:0 -6px}}
h1{font-size:34px;font-weight:700;line-height:1.3;margin:0 0 8px;text-wrap:balance}
.lead{margin:0 0 12px;opacity:.92;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:500}
.consent{font-size:12px;opacity:.8;text-align:center;margin:0}
.grow{flex:1}
.demo-banner{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 12px;font-size:12.5px;text-align:center}
.screen:not(.purple) .demo-banner{background:var(--err-bg);color:var(--err)}
.done-card{margin:30px auto 18px;width:58%;aspect-ratio:4/5;max-width:220px;background:#fff;border-radius:24px;display:grid;place-items:center;align-content:center;gap:10px;color:var(--purple);font-weight:700;transform:rotate(-3deg);box-shadow:0 22px 50px -20px rgba(30,10,70,.6)}
.done-card .ok{width:84px;height:84px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center}
.done-card .ok svg{width:42px;height:42px}
.center{text-align:center}
.toast{font-size:13px;text-align:center;opacity:.9;min-height:1.2em}
</style>
</head>

  alert:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'
};
const svg = (k,w=2) => { const s=document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('fill','none'); s.setAttribute('stroke','currentColor'); s.setAttribute('stroke-width',w); s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round'); s.setAttribute('aria-hidden','true'); s.innerHTML=P[k]; return s; };

const ICONS = {
  "أغلبها بالإنجليزي":"translate","المصطلحات صعبة":"book","البحث طويل":"doc","لا أملك وقتًا كافيًا":"clock",
  "لا أعرف أين أجد الأبحاث":"search","لا أعرف هل المصدر موثوق":"shield","لم أحاول قراءة بحث":"none",
  "محركات البحث مثل Google":"globe","وسائل التواصل الاجتماعي":"chat","أدوات الذكاء الاصطناعي مثل ChatGPT":"sparkle",
  "مواقع ومقالات علمية":"doc","الأبحاث العلمية مباشرة":"flask","لا أبحث عنها":"none",
  "ملخصات عربية بلغة بسيطة":"translate","رابط للبحث الأصلي":"link","اختيار المواضيع التي تهمني":"tag","التأكد من أن المعلومات موثوقة":"shieldCheck",
  "حفظ الملخصات للرجوع لها لاحقًا":"bookmark","قائمة بالملخصات التي قرأتها":"list","رسالة على بريدك عند نزول أبحاث جديدة في مواضيعك":"mail",
  "ملخص صوتي تستمع له":"audio","مشاركة الملخص مع غيرك":"share","الوضع الليلي (خلفية داكنة)":"moon",
  "الجوال":"phone","اللابتوب أو الكمبيوتر":"laptop","الآيباد أو التابلت":"tablet"
};

const A = {};
let step = -1;
let sending = false;
let showErr = '';
let lastStep = null;
const app = document.getElementById('app');
const DEMO = !SCRIPT_URL || SCRIPT_URL.startsWith('PASTE');

function el(tag, attrs={}, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k==='class') n.className=v; else if (k.startsWith('on')) n.addEventListener(k.slice(2),v);
    else if (v!==false && v!=null) n.setAttribute(k, v===true?'':v);
  }
  for (const k of kids.flat()) if (k!=null && k!==false) n.append(k.nodeType?k:document.createTextNode(k));
  return n;
}
const ar = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

function missing(q){
  const v = A[q.id];
  if (q.optional) return '';
  if (q.type==='multi') return (Array.isArray(v)&&v.length) ? '' : 'اختر بطاقة واحدة على الأقل عشان تكمل';
  if (q.type==='scale') return v ? '' : 'اختر رقمًا عشان تكمل';
  if (q.type==='forms'){
    if (!v) return 'اختر شكلًا عشان تكمل';
    if (v==='لا يناسبني أي شكل' && !(A.q17_other_text||'').trim()) return 'اكتب الشكل الذي تفضّله عشان تكمل';
    return '';
  }
  return v ? '' : 'اختر بطاقة عشان تكمل';
}

function topBar(q){
  const cur = SECTIONS.indexOf(q.sec);
  const bars = el('div',{class:'bars','aria-hidden':'true'}, SECTIONS.map((_,i)=>el('i',{class:i<=cur?'on':''})));
  const back = el('button',{type:'button',class:'back','aria-label':'السؤال السابق',onclick:goBack}, svg('back'));
  return el('div',{class:'top'}, bars, back,
    el('span',{class:'sr',style:'position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)'}, `السؤال ${ar(step+1)} من ${ar(Q.length)}، قسم ${q.sec}`));
}

function optionCards(q){
  const useIcons = q.o.some(o=>ICONS[o]);
  const long = q.o.some(o=>o.length>24);
  const oneCol = !useIcons && long;
  const grid = el('div',{class:'grid'+(oneCol?' one':''),role:q.type==='single'?'radiogroup':'group','aria-labelledby':'qt'});
  q.o.forEach((opt,i)=>{
    const on = q.type==='single' ? A[q.id]===opt : (A[q.id]||[]).includes(opt);
    const ic = ICONS[opt];
    const wide = !oneCol && (opt.length>24 || (i===q.o.length-1 && q.o.length%2===1));
    const b = el('button',{type:'button',class:'opt'+(ic?' icon':'')+(wide?' wide':''),role:q.type==='single'?'radio':'checkbox','aria-checked':String(on),onclick:()=>{
      if (q.type==='single') A[q.id]=opt;
      else {
        let cur = new Set(A[q.id]||[]);
        if (cur.has(opt)) cur.delete(opt);
        else if (opt===q.exclusive) cur = new Set([opt]);
        else { cur.delete(q.exclusive); cur.add(opt); }
        A[q.id]=[...cur];
      }
      showErr=''; render(b.dataset.k);
    }});
    b.dataset.k = q.id+'|'+i;
    if (ic) b.append(el('span',{class:'ic'}, svg(ic)));
    b.append(el('span',{class:'lbl'}, opt));
    if (q.type==='multi' || ic || on) b.append(el('span',{class:'tick'}, svg('check',3)));
    if (wide && ic){ b.style.flexDirection='row'; b.style.alignItems='center'; b.style.minHeight='64px'; b.style.justifyContent='flex-start'; }
    grid.append(b);
  });
  return grid;
}

function exampleBadges(){
  return el('div',{class:'ex'},
    el('div',{class:'cap'},'مثال'),
    el('div',{class:'badges'}, el('span',{class:'badge high'}, svg('shieldCheck'), 'موثوقية عالية'), el('span',{class:'badge pre'}, svg('info'), 'دراسة أولية')),
    el('h3',{}, EXAMPLE.title),
    el('div',{}, 'تظهر العلامة فوق كل ملخص، وتوضّح لك مدى قوة البحث.'));
}
function exampleReason(){
  const r = el('div',{class:'reason',hidden:true},
    el('b',{},'لماذا «موثوقية عالية»؟'),
    '• منشور في مجلة مصنّفة Q1', el('br'), '• استشهد به باحثون كُثر', el('br'), '• دراسة محكّمة وغير مسحوبة');
  const btn = el('button',{type:'button',class:'badge high','aria-expanded':'false',onclick:()=>{r.hidden=!r.hidden;btn.setAttribute('aria-expanded',String(!r.hidden));}}, svg('shieldCheck'), 'موثوقية عالية');
  return el('div',{class:'ex'}, el('div',{class:'cap'},'جرّب: اضغط على العلامة'), el('div',{class:'badges'},btn), el('h3',{}, EXAMPLE.title), r);
}
function formsPicker(q){
  const wrap = el('div');
  wrap.append(el('p',{class:'note',style:'margin:0 0 12px'},'هذه أربع طرق لعرض ملخص البحث نفسه. اقرأها ثم اختر الأنسب لك. المثال للتوضيح فقط، وليس بحثًا حقيقيًا.'));
  const grid = el('div',{class:'forms',role:'radiogroup','aria-labelledby':'qt'});
  const bodies = {
    'الشكل أ':[el('h4',{},EXAMPLE.title), EXAMPLE.short],
    'الشكل ب':[el('h4',{},EXAMPLE.title), EXAMPLE.para],
    'الشكل ج':[el('h4',{},EXAMPLE.title), el('ul',{}, EXAMPLE.points.map(p=>el('li',{},p)))],
    'الشكل د':[el('h4',{},EXAMPLE.title), EXAMPLE.short.split('.')[0]+'. ', el('span',{class:'more'},'اقرأ المزيد')]
  };
  Object.entries(bodies).forEach(([k,body],i)=>{
    const b = el('button',{type:'button',class:'fpick',role:'radio','aria-checked':String(A[q.id]===k),onclick:()=>{A[q.id]=k;A.q17_other_text='';showErr='';render(b.dataset.k);}},
      el('span',{class:'letter'}, k.replace('الشكل ','')), ...body);
    b.dataset.k='f'+i; grid.append(b);
  });
  wrap.append(grid);
  const none='لا يناسبني أي شكل';
  const nb = el('button',{type:'button',class:'opt wide',role:'radio','aria-checked':String(A[q.id]===none),onclick:()=>{A[q.id]=none;showErr='';render();setTimeout(()=>document.getElementById('other')?.focus(),0);}}, el('span',{class:'lbl'},none));
  wrap.append(el('div',{class:'grid one'}, nb));
  if (A[q.id]===none){
    const ta = el('textarea',{id:'other',placeholder:'كيف تفضّل أن يظهر الملخص؟',maxlength:'500'});
    ta.value = A.q17_other_text||''; ta.addEventListener('input',()=>{A.q17_other_text=ta.value;});
    wrap.append(el('div',{class:'tbox',style:'margin-top:10px'}, ta));
  }
  return wrap;
}

function renderQuestion(focusKey){
  const q = Q[step];
  const last = step===Q.length-1;
  const hints = {single:'اختر إجابة واحدة', multi:'اختر كل ما ينطبق', scale:'من ١ إلى ٥', forms:'اختر شكلًا واحدًا'};
  const main = el('main',{class: lastStep!==step ? 'anim' : ''});
  lastStep = step;
  main.append(el('p',{class:'sec'}, q.sec), el('h2',{id:'qt'}, q.t));
  if (q.type==='text') main.append(el('span',{class:'pill'},'اختياري'));
  else main.append(el('p',{class:'hint'}, hints[q.type]));
  if (q.demo==='badges') main.append(exampleBadges());
  if (q.demo==='reason') main.append(exampleReason());
  if (q.type==='single'||q.type==='multi'){
    main.append(optionCards(q));
    if (q.exclusive) main.append(el('p',{class:'note'}, `«${q.exclusive}» لا يُختار مع غيره.`));
  }
  if (q.type==='scale'){
    const sc = el('div',{class:'scale',role:'radiogroup','aria-labelledby':'qt'});
    for (let i=1;i<=5;i++){ const b=el('button',{type:'button',role:'radio','aria-checked':String(A[q.id]===i),onclick:()=>{A[q.id]=i;showErr='';render('s'+i);}}, ar(i)); b.dataset.k='s'+i; sc.append(b); }
    main.append(sc, el('div',{class:'scale-lbl'}, el('span',{},q.lo), el('span',{},q.hi)));
  }
  if (q.type==='forms') main.append(formsPicker(q));
  if (q.type==='text'){
    const ta = el('textarea',{id:'final',placeholder:'اكتب فكرتك هنا',maxlength:'1000'});
    ta.value = A[q.id]||''; ta.addEventListener('input',()=>{A[q.id]=ta.value;});
    main.append(el('div',{class:'tbox'}, el('span',{class:'bulb'}, svg('bulb')), ta));
  }
  const foot = el('div',{class:'foot'});
  if (showErr) foot.append(el('div',{class:'err',role:'alert'}, svg('alert'), showErr));
  foot.append(el('button',{type:'button',class:'btn',disabled:sending,onclick:last?submit:goNext}, last?(sending?'جارٍ الإرسال…':'إرسال'):'التالي'));
  const scr = el('div',{class:'screen'}, topBar(q), main, foot);
  app.replaceChildren(scr);
  const f = (focusKey && scr.querySelector(`[data-k="${focusKey}"]`));
  if (f) f.focus({preventScroll:true});
}

function renderWelcome(){
  const scr = el('div',{class:'screen purple'}, el('div',{class:'inner'},
    el('div',{class:'stack','aria-hidden':'true'},
      el('div',{class:'c c1'}, svg('search',2.2)),
      el('div',{class:'c c2'}, svg('doc',2.2)),
      el('div',{class:'c c3'}, svg('shieldCheck',2), el('span',{},'موثوق'))),
    el('h1',{},'ساعدنا نبني أُفُق'),
    el('p',{class:'lead'},'نحن طالبات هندسة البرمجيات في جامعة جدة، ونبني «أُفُق»: موقعًا يقدّم ملخصات عربية مبسّطة للأبحاث العلمية. رأيك يساعدنا نحدد أهم ميزاته.'),
    el('div',{class:'chips'}, el('span',{},'٤–٥ دقائق'), el('span',{},'بدون اسم'), el('span',{},'المشاركة اختيارية'), el('span',{},'١٨ سنة فأكثر')),
    el('div',{class:'grow'}),
    DEMO ? el('div',{class:'demo-banner',style:'margin-bottom:10px'},'وضع التجربة: الاستبيان غير مربوط بـ Google Sheet بعد، فالإجابات لن تُحفظ.') : null,
    el('p',{class:'consent'},'بالضغط على «ابدأ»، توافق على استخدام إجاباتك لأغراض المشروع الأكاديمية فقط، ويمكنك التوقف في أي وقت.'),
    el('div',{class:'foot',style:'margin-top:12px'}, el('button',{type:'button',class:'btn white',onclick:()=>{step=0;render();}},'ابدأ'))));
  app.replaceChildren(scr);
}

function renderDone(){
  const toast = el('div',{class:'toast',role:'status'});
  const scr = el('div',{class:'screen purple'}, el('div',{class:'inner center'},
    el('div',{class:'done-card'}, el('span',{class:'ok'}, svg('check',3)), el('span',{}, `${ar(Q.length)} من ${ar(Q.length)}`)),
    el('h1',{},'شكرًا لك'),
    el('p',{class:'lead'},'وصلتنا إجاباتك. مشاركتك تساعدنا نقرّب العلم من القارئ العربي.'),
    DEMO ? el('div',{class:'demo-banner'},'وضع التجربة: الإجابات لم تُحفظ.') : null,
    el('div',{class:'grow'}),
    toast,
    el('div',{class:'foot'}, el('button',{type:'button',class:'btn white',onclick:async()=>{
      const url = location.href.split('#')[0];
      try{ if (navigator.share){ await navigator.share({title:'استبيان أُفُق',url}); return; } }catch(e){ if (e && e.name==='AbortError') return; }
      try{ await navigator.clipboard.writeText(url); toast.textContent='تم نسخ رابط الاستبيان'; }catch(e){ toast.textContent=url; }
    }}, svg('share'), ' شارك الاستبيان'))));
  app.replaceChildren(scr);
}

function render(focusKey){
  if (step<0) return renderWelcome();
  if (step>=Q.length) return renderDone();
  renderQuestion(focusKey);
}
function goNext(){
  const m = missing(Q[step]);
  if (m){ showErr=m; render(); return; }
  showErr=''; step++; render(); window.scrollTo({top:0});
}
function goBack(){ showErr=''; step=Math.max(-1,step-1); render(); window.scrollTo({top:0}); }

async function submit(){
  if (sending) return;
  sending=true; showErr=''; render();
  try{
    if (!DEMO) await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(A)});
    sending=false; step=Q.length; render(); window.scrollTo({top:0});
  }catch(e){
    sending=false; showErr='تعذّر الإرسال. تأكد من اتصالك بالإنترنت ثم اضغط «إرسال» مرة أخرى.'; render();
  }
}
render();
</script>
</body>
</html>
